services:
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.117.0@sha256:a22772de11861a97d395eecdbe6fbaedd245498b015e748ca409f526430ca781
    environment:
      USERNAME: ${DOCUMENTDB_USERNAME:?Run the setup command first}
      PASSWORD: ${DOCUMENTDB_PASSWORD:?Run the setup command first}
    # Reachable by the remote VS Code extension in the outer dev container only.
    ports:
      - "127.0.0.1:${SITE_A_EXTENSION_PORT:-10270}:10260"
    volumes:
      - documentdb-data:/data
    stop_grace_period: 30s

  documentdb-site-b:
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.117.0@sha256:a22772de11861a97d395eecdbe6fbaedd245498b015e748ca409f526430ca781
    environment:
      USERNAME: ${SITE_B_USERNAME:?Run the setup command first}
      PASSWORD: ${SITE_B_PASSWORD:?Run the setup command first}
    ports:
      - "127.0.0.1:${SITE_B_EXTENSION_PORT:-10271}:10260"
    volumes:
      - documentdb-site-b-data:/data
    stop_grace_period: 30s

  app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    init: true
    depends_on:
      documentdb:
        condition: service_started
      documentdb-site-b:
        condition: service_started
    environment:
      DOCUMENTDB_USERNAME: ${DOCUMENTDB_USERNAME:?Run the setup command first}
      DOCUMENTDB_PASSWORD: ${DOCUMENTDB_PASSWORD:?Run the setup command first}
      LOCAL_DOCUMENTDB_HOST: documentdb
      LOCAL_DATABASE_NAME: ${LOCAL_DATABASE_NAME:-ato_workshop}
      SITE_B_USERNAME: ${SITE_B_USERNAME:?Run the setup command first}
      SITE_B_PASSWORD: ${SITE_B_PASSWORD:?Run the setup command first}
      SITE_B_DOCUMENTDB_HOST: documentdb-site-b
      SITE_B_DATABASE_NAME: ${SITE_B_DATABASE_NAME:-ato_workshop}
      # Attendee startup cannot inherit a legacy Azure URI or scenario.
      CLOUD_DOCUMENTDB_URI: ""
      CLOUD_DATABASE_NAME: ""
      WORKSHOP_SCENARIO: attendee
      WORKSHOP_MODE: ${WORKSHOP_MODE:-starter}
      WORKSHOP_LOCATION: ${WORKSHOP_LOCATION:-laptop}
      WORKSHOP_PUBLIC_HOST: ${WORKSHOP_PUBLIC_HOST:-}
      ACTIVE_TARGET: local
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${WORKSHOP_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src:ro
      - ./examples:/app/examples:ro
      - ./exercises:/app/exercises:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s

volumes:
  documentdb-site-b-data:
  documentdb-data:
